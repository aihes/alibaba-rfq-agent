appId: com.rfq.assistant
productName: RFQ助手
asar: false
npmRebuild: false
afterPack: ./src/desktop/after-pack.cjs
directories:
  output: dist/desktop
files:
  # 明确列出发布资源。node_modules 由 builder 仅收集生产依赖。
  # 私有 data、.env、测试和开发笔记均不进入安装包。
  - package.json
  - src/**
  - config/default.json
  - config/pricing-rules.json
  - plugins/alibaba-rfq-midscene/scripts/**
  - plugins/alibaba-login-export/**
  - scripts/build_case_catalog.mjs
  - scripts/console-quote.mjs
  - scripts/scan_all_terms.mjs
  - scripts/notify-console.mjs
  - scripts/notification-tools.mjs
  - vendor/midscene/**
  - vendor/terminal-notifier/**
  - '!**/.env*'
  - '!data/**'
  - '!config/*.local.json'
mac:
  category: public.app-category.business
  icon: src/desktop/assets/icon.png
  # 无 Developer ID 的本地测试使用 ad-hoc 签名进行运行和通知验证。
  # 对外分发仍需 Developer ID 与公证，ad-hoc 不代表已通过 Gatekeeper。
  identity: '-'
  target:
    - dmg
    - zip
  artifactName: 'RFQ-Assistant-${version}-mac-${arch}.${ext}'
dmg:
  title: RFQ助手
win:
  signExecutable: false
  icon: src/desktop/assets/icon.png
  target: nsis
  artifactName: 'RFQ-Assistant-${version}-win-${arch}.${ext}'
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
